<style>
.tmx-references{max-width:1380px;margin:0 auto;padding:56px 18px 72px;font-family:Arial,Helvetica,sans-serif}
.tmx-references *{box-sizing:border-box}
.tmx-ref-head{text-align:center;margin:0 auto 36px;max-width:760px}
.tmx-ref-head h1{margin:0 0 10px;font-size:clamp(28px,3vw,42px);line-height:1.15;color:#141414}
.tmx-ref-head p{margin:0;color:#707070;font-size:16px;line-height:1.6}
.tmx-ref-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
.ref-card{min-height:150px;display:flex;align-items:center;justify-content:center;padding:24px;background:#fff;border:1px solid #ececec;border-radius:12px;transition:.22s ease}
.ref-card:hover{transform:translateY(-3px);border-color:#d8d8d8;box-shadow:0 10px 26px rgba(0,0,0,.06)}
.ref-card img{display:block;max-width:100%;max-height:84px;width:auto;height:auto;object-fit:contain;filter:grayscale(100%);opacity:.82;transition:.22s ease}
.ref-card:hover img{filter:grayscale(0);opacity:1;transform:scale(1.02)}
@media(max-width:1100px){.tmx-ref-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:820px){.tmx-ref-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
